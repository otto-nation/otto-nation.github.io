name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check brand configuration
        run: npm run check --workspace otto-nation-site

      - name: Build
        run: |
          npm run build --workspace otto-nation-site 2>&1 | tee "$RUNNER_TEMP/site-build.log"
          if grep -qi 'unique "key" prop' "$RUNNER_TEMP/site-build.log"; then
            echo "::error::React key warning found in the build output"
            exit 1
          fi

      - name: Verify rendered output
        run: npm run verify --workspace otto-nation-site

      # Pack, install into the fixture consumer, build, verify. The release
      # workflow runs the same action before it publishes, so the artifact that
      # ships is the one this proved builds.
      - name: Verify the packed tarball
        uses: ./.github/actions/verify-brand-tarball
