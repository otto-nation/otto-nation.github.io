name: Release brand package

on:
  # release-please runs on every push to main, opening or updating a release PR
  # for any conventional commit touching packages/brand/. Merging that PR is
  # itself a push to main — this same trigger — and that's the run where
  # release-please tags the release and release_created comes back true,
  # gating the packaging job below.
  push:
    branches: [main]
  # The fan-out can fail after the release has already published, and merging
  # the release PR again does nothing — release-please has no new conventional
  # commits to propose it for. Without a way in, every fan-out fix would need a
  # version bump nobody wants. This dispatches packaging + the fan-out alone
  # against a release that is already out.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing brand-v* tag to fan out to consumers"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  # Job id has no hyphen: `needs.release-please.x` in an expression parses the
  # hyphen as subtraction, not as part of the identifier.
  release_please:
    name: Release please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event_name == 'push' }}
    outputs:
      release_created: ${{ steps.release.outputs['packages/brand--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/brand--tag_name'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create or update the release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/.release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  package:
    name: Verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: release_please
    # A dispatch targets a release that already published — there is nothing
    # here left to verify or upload for it, only the fan-out below. This job
    # only ever runs for the push that release-please just tagged.
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine the release tag
        id: tag
        run: echo "tag=${{ needs.release_please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: "npm"

      # release-please already bumped and committed this before tagging, so
      # this just reads what it wrote rather than deriving or verifying
      # anything — a tag that disagreed with the manifest is a state
      # release-please cannot produce.
      - name: Read the release version
        id: version
        run: echo "version=$(node -p "require('./packages/brand/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # npm test only exercises the workspace-symlink path, where the package is
      # reached through a symlink into the repo rather than through what `files`
      # actually packed. A tarball missing a file the tests never noticed would
      # pass it and break on install, so the publish is gated on the same
      # pack → install → build → verify sequence CI runs.
      - name: Verify the packed tarball
        id: tarball
        uses: ./.github/actions/verify-brand-tarball
        with:
          version: ${{ steps.version.outputs.version }}

      # Second release asset, for a consumer with no npm and no Tailwind build
      # at all — a static HTML page, a Vite app with no @otto-nation/brand
      # dependency. packages/brand/test/pack-assets.test.mjs (run above, in
      # the Test step) already proved this script's output byte-matches
      # packages/brand/src, so nothing here re-verifies the zip's contents.
      - name: Pack the vanilla CSS assets
        id: assets
        run: echo "zip=$(bin/pack-brand-assets "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"

      # release-please already created the release and wrote its own
      # changelog-based notes saying *what* changed. This appends the
      # install-URL addendum saying *how* to install it rather than
      # replacing those notes — both are worth keeping.
      - name: Append install notes to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          path="$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG" --json body --jq .body > "$path"
          {
            echo
            echo "---"
            echo
            echo "Install (npm): \`https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/otto-nation-brand-${VERSION}.tgz\`"
            echo
            echo "No-build (tokens.css + fonts.css + fonts, no npm/Tailwind required): \`https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/otto-nation-brand-assets-${VERSION}.zip\`"
          } >> "$path"
          gh release edit "$TAG" --notes-file "$path"

      # release-please already created the release object before this job's
      # assets exist, so a packaging failure now leaves a published release
      # with no tarball rather than no release. The tarball verify step above
      # re-runs on every attempt, so a *broken* asset is never uploaded, and
      # --clobber makes a retry (including a workflow_dispatch replay) idempotent.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "${{ steps.tarball.outputs.tarball }}" \
            "${{ steps.assets.outputs.zip }}" \
            --clobber

  fanout:
    name: Open version-bump PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: package
    # GITHUB_TOKEN cannot open a pull request in another repository, so this job
    # is the only part of the release that needs a credential of its own. The
    # release itself completes without it; consumers are bumped by hand if the
    # secret is absent.
    #
    # `package` is skipped both on a dispatch (by design — see its own `if`)
    # and on the far more common case of an ordinary push that release-please
    # only turns into an updated release PR, not a publish. Those two skips
    # must be told apart: `always()` is what lets a dispatch reach this job at
    # all past a skipped dependency, and the event-name check is what stops an
    # ordinary push's skip from doing the same.
    if: >-
      ${{ always()
      && ((github.event_name == 'push' && needs.package.result == 'success')
      || github.event_name == 'workflow_dispatch')
      && github.repository == 'otto-nation/otto-nation.github.io' }}
    steps:
      # No ref: the fan-out script has to come from the default branch, not from
      # the tag. A tag freezes the script as it was when it was cut, which is
      # exactly the copy that failed if this is a rerun of a broken fan-out.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Consumer lockfiles are refreshed with `npm install --package-lock-only`,
      # so this job needs a Node toolchain even though it builds nothing.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Open a bump PR in each consumer
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_PAT }}
          TAG: ${{ needs.package.outputs.tag || inputs.tag }}
        run: bin/fanout-consumers
