name: Release brand package

on:
  push:
    tags:
      - "brand-v*"
  # The fan-out can fail after the release has already published, and a tag
  # cannot be replayed: `gh release create` refuses a release that exists, and
  # rerunning the original run checks out the tag, so it would replay the same
  # code that just failed. Without a way in, every fan-out fix would need a
  # version bump nobody wants. This dispatches the fan-out alone against a
  # release that is already out.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing brand-v* tag to fan out to consumers"
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A dispatch targets a release that already published; there is nothing here
    # left to do for it.
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: "npm"

      # A tag that disagrees with the manifest would publish a tarball whose
      # filename and contents name different versions, and every consumer would
      # pin a URL that does not describe what it installs.
      - name: Verify tag matches the manifest version
        run: |
          manifest="$(node -p "require('./packages/brand/package.json').version")"
          tagged="${GITHUB_REF_NAME#brand-v}"
          if [[ "$manifest" != "$tagged" ]]; then
            echo "tag $GITHUB_REF_NAME says $tagged, packages/brand/package.json says $manifest" >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
        id: version

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # npm test only exercises the workspace-symlink path, where the package is
      # reached through a symlink into the repo rather than through what `files`
      # actually packed. A tarball missing a file the tests never noticed would
      # pass it and break on install, so the publish is gated on the same
      # pack → install → build → verify sequence CI runs. A tag cut from a commit
      # that never went through the PR-gated ci.yml — a direct push to main, a
      # rebase or cherry-pick before tagging — otherwise reaches consumers with
      # no packaging guard in front of it at all.
      - name: Verify the packed tarball
        id: tarball
        uses: ./.github/actions/verify-brand-tarball
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.tarball.outputs.tarball }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$TARBALL" \
            --title "@otto-nation/brand v${VERSION}" \
            --notes "Install: \`https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/otto-nation-brand-${VERSION}.tgz\`"

  fanout:
    name: Open version-bump PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: release
    # GITHUB_TOKEN cannot open a pull request in another repository, so this job
    # is the only part of the release that needs a credential of its own. The
    # release itself completes without it; consumers are bumped by hand if the
    # secret is absent.
    #
    # `always()` is what lets a dispatch reach this job at all — `release` is
    # skipped there, and a skipped dependency blocks a dependent job under the
    # default condition. The result is still checked, so a failed publish on the
    # tag-push path does not fan out a release that never happened.
    if: >-
      ${{ always()
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
      && github.repository == 'otto-nation/otto-nation.github.io' }}
    steps:
      # No ref: the fan-out script has to come from the default branch, not from
      # the tag. A tag freezes the script as it was when it was cut, which is
      # exactly the copy that failed if this is a rerun of a broken fan-out.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Consumer lockfiles are refreshed with `npm install --package-lock-only`,
      # so this job needs a Node toolchain even though it builds nothing.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Open a bump PR in each consumer
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_PAT }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bin/fanout-consumers
